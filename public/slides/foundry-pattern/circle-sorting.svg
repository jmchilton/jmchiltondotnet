<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-labelledby="cs-title cs-desc">
  <title id="cs-title">Inside the circle versus the edge of the circle</title>
  <desc id="cs-desc">A filled circle labeled "inside the circle" holds established knowledge that a frontier model writes well and can teach to smaller models — a commodity. The glowing boundary band, marked with a dent, is labeled the edge: research as scholarship, richly linked, published, provenanced and checked — not a commodity.</desc>
  <defs>
    <linearGradient id="cs-heat" x1="0" x2="1">
      <stop offset="0" stop-color="#ffc06a"/>
      <stop offset="0.45" stop-color="#f5793a"/>
      <stop offset="1" stop-color="#b8331a"/>
    </linearGradient>
    <style>
      .display { font-family: "Arial Narrow", "Roboto Condensed", sans-serif; font-weight: 700; letter-spacing: .045em; }
      .label { fill: #f1f4f7; font-size: 25px; }
      .detail { fill: #a4abb4; font-size: 15px; font-family: "Arial Narrow", "Roboto Condensed", sans-serif; }
      .micro { font-size: 12px; font-weight: 700; letter-spacing: .15em; font-family: "Arial Narrow", "Roboto Condensed", sans-serif; }
      .micro-warm { fill: #ff9d4d; }
      .micro-cool { fill: #7d8794; }
      .leader { stroke: #68717d; stroke-width: 1.5; fill: none; }
    </style>
  </defs>

  <rect width="960" height="620" rx="24" fill="#111419"/>
  <path d="M0 4H960" stroke="url(#cs-heat)" stroke-width="8"/>

  <!-- the circle of recorded knowledge -->
  <circle cx="322" cy="330" r="188" fill="#262b32"/>
  <circle cx="322" cy="330" r="188" fill="none" stroke="url(#cs-heat)" stroke-width="24"/>

  <!-- the dent at the boundary -->
  <circle cx="476" cy="222" r="30" fill="#111419" stroke="url(#cs-heat)" stroke-width="5"/>

  <!-- interior labels -->
  <text class="micro micro-cool" x="322" y="286" text-anchor="middle">INSIDE THE CIRCLE</text>
  <text class="display label" x="322" y="326" text-anchor="middle">Established knowledge</text>
  <text class="detail" x="322" y="356" text-anchor="middle">A frontier model writes this well —</text>
  <text class="detail" x="322" y="378" text-anchor="middle">and can teach it to smaller ones</text>
  <text class="micro micro-cool" x="322" y="416" text-anchor="middle">COMMODITY</text>

  <!-- leader from the dent to the edge labels -->
  <path class="leader" d="M502 206 L566 178 H612"/>
  <circle cx="612" cy="178" r="3.5" fill="#68717d"/>

  <!-- edge labels -->
  <text class="micro micro-warm" x="628" y="152">THE EDGE</text>
  <text class="display label" x="628" y="192">Research is scholarship</text>
  <text class="detail" x="628" y="224">richly linked · published</text>
  <text class="detail" x="628" y="248">provenance · enforced checks</text>
  <text class="micro micro-warm" x="628" y="286">NOT A COMMODITY</text>

  <!-- the sorting rule -->
  <path d="M628 330 H904" stroke="#343b44" stroke-width="1.5"/>
  <text class="detail" x="628" y="366" style="fill:#c8cdd4">Same question, two shapes.</text>
  <text class="detail" x="628" y="392">Interior tools do not become</text>
  <text class="detail" x="628" y="414">boundary tools by being pointed outward.</text>

  <text class="micro micro-cool" x="322" y="566" text-anchor="middle">THE CIRCLE SORTS THE ARGUMENT</text>
</svg>
