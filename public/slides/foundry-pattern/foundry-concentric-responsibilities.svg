<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="title desc">
  <title id="title">Concentric responsibilities in a Foundry</title>
  <desc id="desc">Three nested circles place the Foundry Pattern at the center, shared Foundry library mechanics and the Astro reference composition in the middle, and instance-owned domain knowledge and application decisions around the outside.</desc>
  <defs>
    <linearGradient id="heat" x1="0" x2="1">
      <stop offset="0" stop-color="#ffc06a"/>
      <stop offset="0.45" stop-color="#f5793a"/>
      <stop offset="1" stop-color="#b8331a"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#080a0c" flood-opacity="0.48"/>
    </filter>
    <style>
      .display { font-family: "Arial Narrow", "Roboto Condensed", sans-serif; font-weight: 700; letter-spacing: .045em; }
      .mono { font-family: "Space Mono", ui-monospace, monospace; }
      .label { fill: #f1f4f7; font-size: 18px; }
      .detail { fill: #a4abb4; font-size: 13px; }
      .micro { fill: #ff9d4d; font-size: 11px; font-weight: 700; letter-spacing: .13em; }
      .node { fill: #262b32; stroke: #59616c; stroke-width: 1.5; }
      .mechanic { fill: #343b44; stroke: #68717d; stroke-width: 1.2; }
    </style>
  </defs>

  <rect width="960" height="720" rx="24" fill="#111419"/>
  <path d="M0 4H960" stroke="url(#heat)" stroke-width="8"/>

  <circle cx="480" cy="352" r="292" fill="#20252b" stroke="#434a54" stroke-width="2" filter="url(#softShadow)"/>
  <circle cx="480" cy="352" r="202" fill="#2b3138" stroke="#e2552b" stroke-width="2"/>
  <circle cx="480" cy="352" r="102" fill="#ad4226" stroke="#ff9d4d" stroke-width="2"/>

  <g class="mono" text-anchor="middle">
    <rect x="359" y="65" width="242" height="27" rx="4" fill="#15191e" stroke="#59616c"/>
    <text class="micro" x="480" y="83">INSTANCE-OWNED APPLICATION</text>

    <rect x="373" y="157" width="214" height="27" rx="4" fill="#15191e" stroke="#e2552b"/>
    <text class="micro" x="480" y="175">REFERENCE COMPOSITION</text>
  </g>

  <g text-anchor="middle">
    <g transform="translate(480 119)">
      <rect class="node" x="-88" y="-23" width="176" height="46" rx="6"/>
      <text class="display label" y="-2">DOMAIN CORPUS</text>
      <text class="mono detail" y="15">papers · tools · examples</text>
    </g>
    <g transform="translate(223 239)">
      <rect class="node" x="-79" y="-23" width="158" height="46" rx="6"/>
      <text class="display label" y="-2">KINDS + FIELDS</text>
      <text class="mono detail" y="15">local type vocabulary</text>
    </g>
    <g transform="translate(737 239)">
      <rect class="node" x="-79" y="-23" width="158" height="46" rx="6"/>
      <text class="display label" y="-2">DOMAIN RULES</text>
      <text class="mono detail" y="15">coherence · policy</text>
    </g>
    <g transform="translate(213 481)">
      <rect class="node" x="-82" y="-23" width="164" height="46" rx="6"/>
      <text class="display label" y="-2">RENDERERS</text>
      <text class="mono detail" y="15">pages · skill content</text>
    </g>
    <g transform="translate(747 481)">
      <rect class="node" x="-82" y="-23" width="164" height="46" rx="6"/>
      <text class="display label" y="-2">TARGET POLICY</text>
      <text class="mono detail" y="15">layout · exit verdict</text>
    </g>
    <g transform="translate(480 590)">
      <rect class="node" x="-105" y="-24" width="210" height="48" rx="6"/>
      <text class="display label" y="-2">MEANING OF CORRECT</text>
      <text class="mono detail" y="16">the domain's external check</text>
    </g>
  </g>

  <g text-anchor="middle">
    <text class="display" x="480" y="216" fill="#f1f4f7" font-size="21">FOUNDRY-LIB</text>
    <text class="mono detail" x="480" y="236">versioned, converged mechanics</text>

    <g transform="translate(353 300)">
      <rect class="mechanic" x="-61" y="-18" width="122" height="36" rx="5"/>
      <text class="mono" y="5" fill="#dfe3e8" font-size="12">schema assembly</text>
    </g>
    <g transform="translate(607 300)">
      <rect class="mechanic" x="-61" y="-18" width="122" height="36" rx="5"/>
      <text class="mono" y="5" fill="#dfe3e8" font-size="12">links + registry</text>
    </g>
    <g transform="translate(341 420)">
      <rect class="mechanic" x="-67" y="-18" width="134" height="36" rx="5"/>
      <text class="mono" y="5" fill="#dfe3e8" font-size="12">casting + lineage</text>
    </g>
    <g transform="translate(619 420)">
      <rect class="mechanic" x="-67" y="-18" width="134" height="36" rx="5"/>
      <text class="mono" y="5" fill="#dfe3e8" font-size="12">reading shell</text>
    </g>
    <text class="mono" x="480" y="492" fill="#ff9d4d" font-size="12">ASTRO · ZOD · MARKDOWN · METADATA</text>
  </g>

  <g text-anchor="middle">
    <text class="mono" x="480" y="319" fill="#ffe0bf" font-size="11" font-weight="700" letter-spacing=".12em">SPECIFICATION</text>
    <text class="display" x="480" y="354" fill="#ffffff" font-size="29">THE PATTERN</text>
    <text class="mono" x="480" y="378" fill="#ffe0bf" font-size="12">knowledge base · Mold</text>
    <text class="mono" x="480" y="398" fill="#ffe0bf" font-size="12">Cast · provenance · check</text>
  </g>

  <text class="mono" x="480" y="683" fill="#a4abb4" font-size="12" text-anchor="middle">The invariant sits at the center; software realizes mechanics; each application supplies meaning.</text>
</svg>
